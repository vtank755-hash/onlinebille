<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" role="img" aria-label="Laptop showing a billing dashboard next to printed invoices">
  <defs>
    <linearGradient id="obBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E5E7EC" />
      <stop offset="1" stop-color="#F5F6F8" />
    </linearGradient>
    <linearGradient id="obDeck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4E7EC" />
      <stop offset="1" stop-color="#B7BDC8" />
    </linearGradient>
    <clipPath id="obScreen">
      <rect x="104" y="60" width="292" height="176" rx="4" />
    </clipPath>
    <clipPath id="obFrame">
      <rect width="520" height="380" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#obFrame)">
    <!-- Background -->
    <rect width="520" height="380" fill="url(#obBg)" />
    <circle cx="470" cy="60" r="128" fill="#DADDE4" opacity="0.75" />
    <path d="M0 330 C 120 300 200 340 320 316 C 420 296 470 320 520 306 L520 380 L0 380 Z" fill="#FFFFFF" opacity="0.55" />

    <!-- Desk shadow -->
    <ellipse cx="248" cy="292" rx="212" ry="16" fill="#0F172A" opacity="0.08" />

    <!-- Printed invoices -->
    <g transform="rotate(-7 452 300)">
      <rect x="396" y="258" width="112" height="82" rx="6" fill="#EDF0F5" stroke="#DDE2EA" />
      <rect x="410" y="274" width="58" height="7" rx="3.5" fill="#C9D1DE" />
      <rect x="410" y="290" width="84" height="6" rx="3" fill="#DCE2EB" />
      <rect x="410" y="304" width="84" height="6" rx="3" fill="#DCE2EB" />
      <rect x="410" y="318" width="46" height="6" rx="3" fill="#DCE2EB" />
    </g>

    <g transform="rotate(5 448 296)">
      <rect x="392" y="252" width="112" height="84" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
      <rect x="392" y="252" width="112" height="18" rx="6" fill="#2F6FED" />
      <rect x="404" y="280" width="44" height="7" rx="3.5" fill="#93A4C0" />
      <rect x="404" y="296" width="86" height="6" rx="3" fill="#DCE2EB" />
      <rect x="404" y="310" width="86" height="6" rx="3" fill="#DCE2EB" />
      <rect x="404" y="324" width="56" height="6" rx="3" fill="#DCE2EB" />
    </g>

    <!-- Laptop -->
    <g>
      <rect x="96" y="52" width="308" height="200" rx="12" fill="#0F172A" />
      <rect x="104" y="60" width="292" height="176" rx="4" fill="#1D2939" />
      <circle cx="250" cy="56" r="2.5" fill="#334155" />

      <!-- Dashboard shown on the screen -->
      <g clip-path="url(#obScreen)">
        <!-- stat labels -->
        <rect x="130" y="72" width="52" height="6" rx="3" fill="#475569" />
        <rect x="224" y="72" width="52" height="6" rx="3" fill="#475569" />
        <rect x="318" y="72" width="52" height="6" rx="3" fill="#475569" />

        <!-- donut charts -->
        <g fill="none" stroke-width="9" stroke-linecap="round">
          <circle cx="156" cy="116" r="26" stroke="#334155" />
          <circle cx="156" cy="116" r="26" stroke="#3B82F6" stroke-dasharray="114 164" transform="rotate(-90 156 116)" />

          <circle cx="250" cy="116" r="26" stroke="#334155" />
          <circle cx="250" cy="116" r="26" stroke="#22C55E" stroke-dasharray="130 164" transform="rotate(-90 250 116)" />

          <circle cx="344" cy="116" r="26" stroke="#334155" />
          <circle cx="344" cy="116" r="26" stroke="#F97316" stroke-dasharray="84 164" transform="rotate(-90 344 116)" />
        </g>
        <rect x="147" y="112" width="18" height="7" rx="3.5" fill="#94A3B8" />
        <rect x="241" y="112" width="18" height="7" rx="3.5" fill="#94A3B8" />
        <rect x="335" y="112" width="18" height="7" rx="3.5" fill="#94A3B8" />

        <rect x="120" y="154" width="260" height="1" fill="#2E3C51" />

        <!-- bar chart (blue) -->
        <g fill="#3B82F6">
          <rect x="122" y="202" width="12" height="22" rx="3" />
          <rect x="142" y="184" width="12" height="40" rx="3" />
          <rect x="162" y="194" width="12" height="30" rx="3" />
          <rect x="182" y="172" width="12" height="52" rx="3" />
          <rect x="202" y="188" width="12" height="36" rx="3" />
        </g>

        <!-- bar chart (green) -->
        <g fill="#22C55E">
          <rect x="240" y="178" width="12" height="46" rx="3" />
          <rect x="260" y="194" width="12" height="30" rx="3" />
          <rect x="280" y="166" width="12" height="58" rx="3" />
        </g>

        <!-- bar chart (light blue / orange mix) -->
        <g>
          <rect x="318" y="190" width="12" height="34" rx="3" fill="#60A5FA" />
          <rect x="338" y="174" width="12" height="50" rx="3" fill="#60A5FA" />
          <rect x="358" y="198" width="12" height="26" rx="3" fill="#F97316" />
        </g>

        <rect x="120" y="228" width="260" height="1" fill="#2E3C51" />
        <rect x="122" y="232" width="26" height="4" rx="2" fill="#334155" />
        <rect x="240" y="232" width="26" height="4" rx="2" fill="#334155" />
        <rect x="344" y="232" width="26" height="4" rx="2" fill="#334155" />
      </g>

      <!-- laptop deck -->
      <path d="M88 252 H412 L448 278 Q452 284 444 284 H56 Q48 284 52 278 Z" fill="url(#obDeck)" />
      <rect x="212" y="258" width="76" height="7" rx="3.5" fill="#A7AEBB" />
    </g>

    <!-- Pen resting on the invoices -->
    <g transform="rotate(24 470 334)">
      <rect x="428" y="330" width="82" height="9" rx="4.5" fill="#1E293B" />
      <path d="M428 330 L414 334.5 L428 339 Z" fill="#475569" />
      <rect x="494" y="330" width="16" height="9" rx="4.5" fill="#3D4EC2" />
    </g>
  </g>
</svg>
